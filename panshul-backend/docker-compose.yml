services:
  web:
    build:
      context: ../panshul-web
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://panshul:panshul@postgres:5432/panshul
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on: [postgres, redis, qdrant]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: panshul
      POSTGRES_PASSWORD: panshul
      POSTGRES_DB: panshul
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

volumes:
  pgdata:
  qdrant_data:
